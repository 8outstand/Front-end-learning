<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
        * {
            margin: 0;
            padding: 0;
        }

        h2 {
            text-align: center;
        }

        .box {
            width: 600px;
            margin: 50px auto;
            display: flex;
            font-size: 25px;
            line-height: 40px;
        }

        .qs {

            width: 450px;
            height: 40px;
            color: red;

        }

        .btns {
            text-align: center;
        }

        .btns button {
            width: 120px;
            height: 35px;
            margin: 0 50px;
        }
    </style>
</head>
<body>
  <h2>随机点名</h2>
    <div class="box">
        <span>名字是：</span>
        <div class="qs">这里显示姓名</div>
    </div>
    <div class="btns">
        <button class="start">开始</button>
        <button class="end">结束</button>
    </div>
    <script>
      // 数据数组
      const arr = ['马超', '黄忠', '赵云', '关羽', '张飞']
      // 开始按钮
      const start = document.querySelector('.start');
      // 结束按钮
      const end = document.querySelector('.end');
      // 姓名显示区域
      const qs = document.querySelector('.qs');
      // 随机数变量
      let random = 0

      let timer = null
      
      start.addEventListener('click', function() {
        timer = setInterval(function() {
          // 随机数
          random = Math.floor(Math.random() * arr.length);
          // 显示随机姓名
          qs.innerHTML = arr[random];
          if(arr.length === 1){
            //禁用开始和结束按钮
            start.disabled = true;
            end.disabled = true;
          }
        }, 50);
      })
      end.addEventListener('click', function() {
        clearInterval(timer);
        //去除已经选中的人
        arr.splice(random, 1);
      })

    </script>
</body>
</html>
