<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <div></div>
  <script>
    const div = document.querySelector('div')
    const date = new Date()
    div.innerHTML = date.getTime()
    setInterval(() => {
      date.setSeconds(date.getSeconds() + 1)
      div.innerHTML = date.getTime()
    }, 1000)
  </script>
</body>
</html>
