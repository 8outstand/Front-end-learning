<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <img src="./images/ad.png" alt="">
  <script>
    //获取元素的图片
    const img = document.querySelector('img');
    // 延迟 5 秒关闭广告
    setTimeout(() => {
      img.style.display = 'none';
    }, 3000)
  </script>
</body>
</html>
