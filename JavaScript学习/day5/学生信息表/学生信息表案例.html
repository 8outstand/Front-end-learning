<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <title>学生信息管理</title>
  <link rel="stylesheet" href="css/index.css" />
</head>

<body>
  <h1>新增学员</h1>
  <form class="info" autocomplete="off">
    姓名：<input type="text" class="uname" name="uname" />
    年龄：<input type="text" class="age" name="age" />
    性别:
    <select name="gender" class="gender">
      <option value="男">男</option>
      <option value="女">女</option>
    </select>
    薪资：<input type="text" class="salary" name="salary" />
    就业城市：<select name="city" class="city">
      <option value="北京">北京</option>
      <option value="上海">上海</option>
      <option value="广州">广州</option>
      <option value="深圳">深圳</option>
      <option value="曹县">曹县</option>
    </select>
    <button class="add">录入</button>
  </form>

  <h1>就业榜</h1>
  <table>
    <thead>
      <tr>
        <th>学号</th>
        <th>姓名</th>
        <th>年龄</th>
        <th>性别</th>
        <th>薪资</th>
        <th>就业城市</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody>
      <!-- 
        <tr>
          <td>1001</td>
          <td>欧阳霸天</td>
          <td>19</td>
          <td>男</td>
          <td>15000</td>
          <td>上海</td>
          <td>
            <a href="javascript:">删除</a>
          </td>
        </tr> 
        -->
    </tbody>
  </table>
  <script>
  // 参考数据
      const initData = [
        {
          stuId: 1001,
          uname: '欧阳霸天',
          age: 19,
          gender: '男',
          salary: '20000',
          city: '上海',
        }
      ]
      // localStorage.setItem('data', JSON.stringify(initData));
      //1.渲染业务
      //1.1先读取本地数据
      const arr = JSON.parse(localStorage.getItem('data')) || [];
      //如果没有数据用空数组代替
      // if(!arr) {
      //   arr = [];
      // }
      function render(){
        const trArr = arr.map(function (ele){
          return `
          <tr>
            <td>${ele.stuId}</td>
            <td>${ele.uname}</td>
            <td>${ele.age}</td>
            <td>${ele.gender}</td>
            <td>${ele.salary}</td>
            <td>${ele.city}</td>
            <td>
              <a href="javascript:">删除</a>
            </td>
          </tr>
          `
        })
        //1.2 拼接字符串
        const trStr = trArr.join('');
        //1.3 渲染到页面
        document.querySelector('tbody').innerHTML = trStr;
      }
      render();

      //新增业务
      const info = document.querySelector('.info')
      info.addEventListener('submit', function(e){
        e.preventDefault();
        const uname = info.querySelector('.uname');
        const age = info.querySelector('.age');
        const gender = info.querySelector('.gender');
        const salary = info.querySelector('.salary');
        const city = info.querySelector('.city');
        if(!uname.value || !age.value || !salary.value ){
          alert('请填写完整信息');
          return;
        }
        arr.push(
        {
          stuId: arr.length + 1001,
          uname: uname.value,
          age: age.value,
          gender: gender.value,
          salary: salary.value,
          city: city.value,
        }
      )
        // 保存到本地存储
        localStorage.setItem('data', JSON.stringify(arr));
        //1.4 渲染到页面
        render();
        //1.5 清空表单
        info.reset();
      })

      //删除业务实现
      document.querySelector('tbody').addEventListener('click', function(e){
        if(e.target.tagName === 'A'){
          //1.1 删除数组中的元素
          const index = e.target.parentElement.parentElement.rowIndex - 1;
          arr.splice(index, 1);
          //1.2 保存到本地存储
          localStorage.setItem('data', JSON.stringify(arr));
          //1.3 渲染到页面
          render();
        }
      })
      
      
  </script>
</body>

</html>
