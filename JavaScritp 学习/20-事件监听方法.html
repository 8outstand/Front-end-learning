<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <button>点击我</button>
  <script>
    const btn = document.querySelector('button');
    btn.onclick = function() {
      console.log('点击了按钮');
    }
    //会出现覆盖问题，后注册的事件会覆盖先注册的事件
    btn.onclick = function() {
      console.log('点击了按钮2');
    }
    // 解决覆盖问题，使用事件监听方法
    btn.addEventListener('click', function() {
      console.log('点击了按钮3');
    })
  </script>
</body>
</html>
