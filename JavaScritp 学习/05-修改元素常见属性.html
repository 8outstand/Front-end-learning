<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <img src="./images/1.webp" alt="">
  <script>
    //获取元素的图片
    const img = document.querySelector('img');
    //修改元素的对象属性 对象.属性 = 值
    img.src = './images/2.webp';
    //修改元素的对象属性 对象.属性 = 值
    img.alt = '这是一个图片';
    img.title = '这是一个图片';
  </script>
</body>
</html>
