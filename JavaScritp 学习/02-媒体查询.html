<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <div class="box">
    我是一个div
  </div>
  <ul>
    <li>1</li>
    <li>2</li>
    <li>3</li>
  </ul>
  <script>
    const box = document.querySelector('div');
    console.log(box);
    const ul = document.querySelectorAll('ul li');
    console.log(ul);
    // 遍历ul
    for (let i = 0; i < ul.length; i++) {
      console.log(ul[i]);
    }
  </script>
</body>
</html>
