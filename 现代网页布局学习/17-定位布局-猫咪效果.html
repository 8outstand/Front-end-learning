<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    ol,
    ul {
      list-style: none;
    }

    .box ul {
      display: flex;
      gap: 5px;
      /* 水平滚动条 */
      overflow-x: scroll;
      /* 隐藏滚动条 */
      scrollbar-width: none;
      /* 平滑滚动 */
      scroll-behavior: smooth;
    }
    .box {
      overflow: hidden;
      width: 1000px;
      margin: 100px auto;
      position: relative;
    }
    .box::before{
      position: absolute;
      top: -50px;
      content: '';
      width: 100%;
      height: 100px;
      background-color: #fff;
      border-radius: 50%;
    }
    .box::after{
      position: absolute;
      bottom: -50px;
      content: '';
      width: 100%;
      height: 100px;
      background-color: #fff;
      border-radius: 50%;
    }
    .box ul li{
      /* width: 200px; */
      /* 不拉伸， 不伸缩  初始值设置为200px  */
      flex: 0 0 200px;
    }
    .box ul li img{
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="box">
    <ul>
      <li><a href="#"><img src="./img/cat1.jpg" alt=""></a></li>
      <li><a href="#"><img src="./img/cat2.jpg" alt=""></a></li>
      <li><a href="#"><img src="./img/cat3.jpg" alt=""></a></li>
      <li><a href="#"><img src="./img/cat4.jpg" alt=""></a></li>
      <li><a href="#"><img src="./img/cat5.jpg" alt=""></a></li>
      <li><a href="#"><img src="./img/cat6.jpg" alt=""></a></li>
      <li><a href="#"><img src="./img/cat7.jpg" alt=""></a></li>
      <li><a href="#"><img src="./img/cat8.jpeg" alt=""></a></li>
      <li><a href="#"><img src="./img/cat9.jpeg" alt=""></a></li>
      <li><a href="#"><img src="./img/cat10.jpeg" alt=""></a></li>
      <li><a href="#"><img src="./img/cat11.jpeg" alt=""></a></li>
      <li><a href="#"><img src="./img/cat12.jpeg" alt=""></a></li>
    </ul>
  </div>
