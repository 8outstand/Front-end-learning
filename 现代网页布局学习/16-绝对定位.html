<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    /* 绝对定位是按照最近的有定位的父元素进行定位，但是不占位置 */
    .father{
      width: 500px;
      height: 500px;
      background-color: pink;
      position: relative;
    }
    .son1{
      width: 200px;
      height: 200px;
      background-color: yellow;
      position: absolute;
      top: 100px;
      left: 100px;
    }
    .son2{
      width: 200px;
      height: 200px;
      background-color: aquamarine;
      position: absolute;
      top: 200px;
      right: 200px;
    }
  </style>
</head>
<body>
  <div class="father">
    <div class="son1"></div>
    <div class="son2"></div>
  </div>
</body>
</html>
